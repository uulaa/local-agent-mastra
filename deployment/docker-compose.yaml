name: ai-agent

services:
  # ── LLM: Ollama in a container (OpenAI-compatible API, fully local) ──────
  llm:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # For NVIDIA GPU acceleration, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pull the chat + embedding models into the llm service.
  llm-init:
    image: ollama/ollama:latest
    depends_on:
      llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://llm:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull ${OLLAMA_MODEL} && ollama pull ${OLLAMA_EMBED_MODEL}
    restart: "no"

  # ── PostgreSQL with seeded demo data ─────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Seed SQL runs automatically on first start (empty data volume).
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ── Qdrant vector database ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # The qdrant image has no curl/wget; use bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: embed the docs in ai-agent-back/docs into Qdrant.
  ingest:
    build: ../back
    command: ["npm", "run", "ingest"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      OLLAMA_BASE_URL: http://llm:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      CHUNK_SIZE: ${CHUNK_SIZE:-400}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-60}
    depends_on:
      qdrant:
        condition: service_healthy
      llm-init:
        condition: service_completed_successfully
    restart: "no"

  # ── Mastra backend ───────────────────────────────────────────────────────
  back:
    build: ../back
    environment:
      HOST: 0.0.0.0
      PORT: 4111
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      OLLAMA_BASE_URL: http://llm:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_TOP_P: ${LLM_TOP_P:-0.9}
      LLM_TOP_K: ${LLM_TOP_K:-30}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
    ports:
      - "${BACK_PORT:-4111}:4111"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      llm-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Next.js frontend ─────────────────────────────────────────────────────
  web:
    build: ../web
    environment:
      MASTRA_URL: http://back:4111
      MASTRA_AGENT_ID: company-agent
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - back
    restart: unless-stopped

volumes:
  ollama_models:
  pg_data:
  qdrant_storage:
